        :root {
            --red: #FF595E;
            --orange: #FF924C;
            --yellow: #FFCA3A;
            --green: #8AC926;
            --blue: #1982C4;
            --indigo: #6A4C93;
            --violet: #B5179E;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3, .logo-text {
            font-family: 'Fredoka One', cursive;
        }

        .rainbow-border {
            border-bottom: 5px solid;
            border-image: linear-gradient(to right, var(--red), var(--orange), var(--yellow), var(--green), var(--blue), var(--indigo), var(--violet)) 1;
        }

        .nav-link {
            position: relative;
            transition: color 0.3s;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            bottom: -5px;
            left: 0;
            background-color: var(--blue);
            transition: width 0.3s;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        .mobile-menu {
            transition: transform 0.3s ease-in-out;
        }

        /* Gallery Transition Styles */
        .gallery-container {
            position: relative;
            height: 500px;
            overflow: hidden;
            border-radius: 2rem;
        }

        .gallery-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-slide.active {
            opacity: 1;
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const closeMenu = document.getElementById('closeMenu');
        const mobileMenu = document.getElementById('mobileMenu');

        menuBtn.addEventListener('click', () => mobileMenu.classList.remove('translate-x-full'));
        closeMenu.addEventListener('click', () => mobileMenu.classList.add('translate-x-full'));

        // Start gallery slideshow automatically on this page
        let currentSlide = 0;
        let galleryInterval;

        function startGallery() {
            const slides = document.querySelectorAll('.gallery-slide');
            if (slides.length > 0) {
                galleryInterval = setInterval(() => {
                    slides[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add('active');
                }, 3000);
            }
        }
        
        // Execute slideshow on page load
        window.onload = startGallery;
    </script>
